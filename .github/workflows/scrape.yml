name: Daily Proxy Scrape

on:
  schedule:
    # UTC 时间每天 02:00 运行（约北京时间上午 10:00），可自行调整
    - cron: "0 2 * * *"
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper (scrape + write file + sync Gist)
        env:
          SITE_COOKIE: ${{ secrets.SITE_COOKIE }}
          SITE_USERNAME: ${{ secrets.SITE_USERNAME }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: python scrape.py

      - name: Commit results back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add proxies/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update proxy list $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Clean up old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 3       # 保留最近 3 天内的运行记录
          keep_minimum_runs: 1 # 无论如何至少保留最近 1 次，防止全清空
